<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ '/assets/img/flacso_logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <img src="{{ '/assets/img/flacso_logo_w.png' | relative_url }}" alt="FLACSO Ecuador"
        onerror="this.onerror=null;this.src='{{ '/assets/img/flacso_logo.png' | relative_url }}';">
      <span class="topbar-title">Observatorio de Desigualdad,<br>Pobreza y Empleo</span>
      <nav class="topbar-nav">
        <a href="{{ '/' | relative_url }}">Inicio</a>
        <a href="{{ '/dashboard/index.html' | relative_url }}">Dashboard</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/boletines/' | relative_url }}">Boletines</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    FLACSO Ecuador · Observatorio de Desigualdad, Pobreza y Empleo · Datos: INEC, WID, SRI
  </footer>

</body>
</html>
